[project]
name = "wxbot-channel"
version = "0.1.0"
description = "WeChat iLink bot channel for the Hive Go stdio channel host"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "wechatbot-sdk>=0.3.0",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
wxbot-channel = "wxbot_channel.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
