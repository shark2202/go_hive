# go_hive 架构模型（唯一手写源）
#
# 本文件是架构可视化的人工维护入口：生成器读取它 + `go list -json ./...`，
# 产出 docs/architecture/ 下的图与表，以及 architecture/graph.json。
#
# 编辑约定（生成器只支持这个 YAML 子集，保持可审阅）：
#   - 只用缩进映射、块序列、方括号流式列表和双引号字符串；
#   - 不支持锚点/别名、多行块标量（| 和 >）、制表符；
#   - 以 # 开头的整行是注释（行尾 # 不是注释）。
#
# 分层规则：depth 从上到下递增。依赖只能由浅指向深；反向依赖进 warnings。
# stability: stable | evolving
# maturity:  live | tested | unverified（口径见 docs/architecture/README.md）

meta:
  title: "go_hive 架构模型"
  module: "github.com/shark2202/go_hive/go-hive"
  module_dir: "go-hive"
  graph_schema_version: 1

layers:
  - id: entry
    name: "入口层"
    depth: 0
    description: "进程入口，只做 argv 解析与退出码转换，不含业务逻辑。"
  - id: harness
    name: "测试与评测装置"
    depth: 0
    description: "不随发布物交付的测试装置：e2e 确定性假上游、契约对照工具与发布脚本测试；只被测试与内部评测入口引用。"
  - id: assembly
    name: "装配层"
    depth: 1
    description: "组合根：读配置、构造 home / 工具注册表 / MCP runtime / 会话与 colony 运行时，再把命令路由到下游。"
  - id: transport
    name: "传输层"
    depth: 2
    description: "HTTP + SSE 边界：路由、会话查找、请求校验、事件镜像；不含 agent 决策。"
  - id: orchestration
    name: "编排层"
    depth: 3
    description: "Queen / Colony / Worker 的生命周期与协调：派发、报告、计划、账本、触发器、看护。"
  - id: runtime
    name: "执行原语层"
    depth: 4
    description: "唯一的执行原语 AgentLoop：一次 turn 内的模型调用、工具批处理、压缩、预算与停泊。"
  - id: capability
    name: "能力层"
    depth: 5
    description: "可被循环调用的能力：工具、集成、LLM 传输、记忆、技能、soul、凭据、出站消息。"
  - id: foundation
    name: "基础层"
    depth: 6
    description: "无业务语义的底座：事件总线、文件存储、schema、原子写、目录布局、限速、质量门禁。"

packages:
  # ---------------- entry ----------------
  - package: cmd/hive
    layer: entry
    responsibility: "hive 主进程入口：把 argv 交给 internal/cli.Runner 并以返回码退出。"
    stability: stable
    entrypoint: true
  - package: cmd/hive-cred
    layer: entry
    responsibility: "凭证 CLI 入口（hive-cred）：复用 internal/cli 的凭证子命令。"
    stability: stable
    entrypoint: true
  - package: cmd/hive-browser
    layer: entry
    responsibility: "浏览器 CLI 客户端（hive-browser）：解析动词与 flag，转发给独立的 Browser Bridge 服务端。"
    stability: stable
    entrypoint: true
  - package: cmd/hive-longmemeval
    layer: entry
    responsibility: "LongMemEval 评测入口（内部工具）：用真实 queen 会话跑基准，并按基准自带判分提示评分。"
    stability: evolving
    entrypoint: true

  # ---------------- assembly ----------------
  - package: internal/cli
    layer: assembly
    responsibility: "装配根：解析命令与配置，构造 home、ToolRegistry、MCP runtime、ChatRuntime、ColonyRuntime，并注册 serve/chat/queen/colony/session/skill/mcp/janitor 子命令。"
    stability: evolving

  # ---------------- transport ----------------
  - package: internal/server
    layer: transport
    responsibility: "HTTP/SSE 传输层：路由注册、会话管理、ChatRuntime 的 turn 队列、colony/tracker/sentinel 适配器与事件桥。"
    stability: evolving
  - package: internal/server/uiembed
    layer: transport
    responsibility: "embed_ui 构建标签下的前端静态资源；未带标签时返回空，让服务端回退到磁盘目录。"
    stability: stable
  - package: internal/runtimehealth
    layer: transport
    responsibility: "进程与宿主机资源健康快照，供 /api/health/resources 使用。"
    stability: stable

  # ---------------- orchestration ----------------
  - package: internal/colony
    layer: orchestration
    responsibility: "Colony 运行时：worker 生命周期与并发闸门、run_worker 批量派发、report_to_parent 回报、playbook 驱动、目标验收与改进信号。"
    stability: evolving
  - package: internal/host
    layer: orchestration
    responsibility: "Host 组合根：把 colony 运行时、事件总线与 run 注册表装成可 Start/Spawn 的宿主，供传输层调用。"
    stability: stable
  - package: internal/queen
    layer: orchestration
    responsibility: "Queen 档案与身份定义（queen_profiles 的 Go 移植）。"
    stability: stable
  - package: internal/session
    layer: orchestration
    responsibility: "会话记录与磁盘布局：状态、transcript、游标、fork 与冷恢复。"
    stability: evolving
  - package: internal/sessionreport
    layer: orchestration
    responsibility: "会话报告打包（report-bundle）：把会话、worker 与证据汇总成一份可交付摘要。"
    stability: stable
  - package: internal/tasks
    layer: orchestration
    responsibility: "任务计划存储：tasks.json 的增删改查、归档与提醒状态。"
    stability: evolving
  - package: internal/tracker
    layer: orchestration
    responsibility: "共享结果账本：SQLite(WAL) tracker.db 的表注册、行写入与查询。"
    stability: evolving
  - package: internal/triggers
    layer: orchestration
    responsibility: "触发器定义、cron 解析与 triggers.json 持久化。"
    stability: evolving
  - package: internal/sentinel
    layer: orchestration
    responsibility: "Queen 停泊期的自治监督：nudge / escalate 判定、升级投递、入站回复路由与恢复。"
    stability: evolving
  - package: internal/playbook
    layer: orchestration
    responsibility: "Playbook 定义与带并发上限的 lane 执行器。"
    stability: evolving
  - package: internal/queenmail
    layer: orchestration
    responsibility: "Queen 之间的信件引擎：信件存储、待投递队列、queens/mail.jsonl 审计日志与 hive MCP stdio 面。"
    stability: evolving
  - package: internal/claudecode
    layer: orchestration
    responsibility: "Claude Code queen 运行时：会话记录与收件箱、claude -p 回合、转录读取与进程树管理。"
    stability: evolving
  - package: internal/longmemeval
    layer: orchestration
    responsibility: "LongMemEval 基准运行器：数据集读取、题目选择、会话播种、判分与结果汇总（内部评测工具）。"
    stability: evolving
  - package: internal/agents
    layer: orchestration
    responsibility: "Agent 规格与发现：读取 agents 目录、worker 元数据与能力描述。"
    stability: evolving

  # ---------------- runtime ----------------
  - package: internal/agentloop
    layer: runtime
    responsibility: "唯一执行原语：一轮内的 LLM 调用、工具批处理与并发、压缩、预算/宽限、judge、提醒注入与停泊原因。"
    stability: evolving
  - package: internal/llmjudge
    layer: runtime
    responsibility: "基于 LLM 的判定器适配：把成功标准与升级判定包装成可注入的 Judge。"
    stability: evolving
  - package: internal/orchestrator
    layer: runtime
    responsibility: "Python 图编排时代遗留的 DataBuffer 原语（权限、幻觉内容校验）。"
    stability: stable
    note: "未接线：仓库内无调用方；本 port 以 run_worker 的扇出取代图编排。"

  # ---------------- capability ----------------
  - package: internal/tools
    layer: capability
    responsibility: "工具注册表：eager/searchable 分层、MCP 服务器加载与代理执行、结果规范化与溢出落盘。"
    stability: evolving
  - package: internal/tools/builtin
    layer: capability
    responsibility: "内置工具实现：read_file / write_file / terminal_exec 等，刻意不依赖 server 与 agentloop。"
    stability: stable
  - package: internal/tools/integrations
    layer: capability
    responsibility: "集成工具集（装配根）：生成目录、领域实现与 InstallBatch* 入口；领域实现按 internal/tools/integrations/<domain> 子包迁出，子包只依赖 integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/excel
    layer: capability
    responsibility: "Excel 领域子包（结构试点）：工具目录、OOXML 读写与 6 个 action 实现；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/devops
    layer: capability
    responsibility: "DevOps/hosting 领域子包（第二个领域子包）：GitLab / AWS S3 / Vercel / Docker Hub 的目录、31 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/ai
    layer: capability
    responsibility: "AI 平台领域子包：Pinecone / Weights & Biases / Langfuse / Hugging Face / Google Cloud Vision 的目录、39 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/social
    layer: capability
    responsibility: "社交媒体领域子包（第四个领域子包）：YouTube / Reddit / Twitter-X / Twilio / Pushover 的目录、36 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/enrichment
    layer: capability
    responsibility: "Enrichment/search 领域子包（第五个领域子包）：Apify / Apollo.io / Lusha / SerpAPI / Exa 的目录、36 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/cloudflare
    layer: capability
    responsibility: "Cloudflare 领域子包（第六个领域子包）：zones / DNS / analytics / security / cache / Workers·R2·Pages / 账户管理的目录、54 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/infra
    layer: capability
    responsibility: "基础设施自动化领域子包（第七个领域子包）：Terraform / PagerDuty / Prometheus / Kafka / n8n / Tines 的目录、32 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/webintel
    layer: capability
    responsibility: "Web-intelligence 领域子包（第八个领域子包）：SimilarWeb / News / Google Maps 的目录、42 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/schedchat
    layer: capability
    responsibility: "调度/聊天领域子包（第九个领域子包）：Brevo / Cal.com / Calendly / Discord / Mattermost 的目录、40 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/pdf
    layer: capability
    responsibility: "PDF 读取领域子包（第十个领域子包）：pdf_read 工具目录、单 action 实现与从零实现的解析栈（xref/流解码/词法/文本抽取/字体编码）；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/gworkspace
    layer: capability
    responsibility: "Google Workspace 领域子包（P3 第十一个领域子包）：Google Sheets / Docs / Gmail / Calendar 的目录、39 个 action 实现、账号别名与 OAuth2 刷新 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/data
    layer: capability
    responsibility: "数据库/数据平台领域子包（P3 第十二个领域子包）：Postgres / Redis / MongoDB / Supabase（含 pgwire/RESP 线协议）与 Snowflake / BigQuery / Databricks / Redshift / Azure SQL / Power BI / SAP 的目录、65 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/collab
    layer: capability
    responsibility: "协作/知识库领域子包（P3 第十三个领域子包）：Jira / Confluence / Asana / Notion / Linear 的目录、60 个 action 实现、账号别名 helper 与 Linear GraphQL 传输；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/crm
    layer: capability
    responsibility: "CRM/客户支持领域子包（P3 第十四个领域子包）：Salesforce / Pipedrive / Zoho CRM / Attio、Intercom / Zendesk / Freshdesk / Greenhouse 与 HubSpot / Obsidian 的目录、109 个 action 实现、OAuth2 刷新与账号 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/tools/integrations/commerce
    layer: capability
    responsibility: "电商/财务领域子包（P3 第十五个领域子包）：Shopify / QuickBooks / Plaid / Razorpay 的目录、29 个 action 实现与共享 helper；只 import integrationkit。"
    stability: evolving
  - package: internal/llm
    layer: capability
    responsibility: "LLM 传输：provider 选择、Anthropic/OpenAI 协议、流式事件、模型目录与出站限速门。"
    stability: evolving
  - package: internal/memory
    layer: capability
    responsibility: "Markdown 记忆文件：召回、写入、按天时间线与反思沉淀。"
    stability: evolving
  - package: internal/skills
    layer: capability
    responsibility: "技能发现/安装/校验，以及 agent 侧的技能读取工具。"
    stability: evolving
  - package: internal/soul
    layer: capability
    responsibility: "Queen 的 soul：分区、字符上限、版本历史、提案与回滚。"
    stability: evolving
    note: "反思的身份读取通过 soul 侧接口 QueenProfileSource（LoadQueenProfile / FormatQueenIdentityPrompt）由装配层 internal/cli 注入 queen 实现；soul 不再 import internal/queen，反向依赖已清零。"
  - package: internal/mcpregistry
    layer: capability
    responsibility: "MCP 服务器注册表 CLI 后端：索引、安装/启用、健康检查与清单渲染。"
    stability: evolving
  - package: internal/attachments
    layer: capability
    responsibility: "会话附件存取（上传、下载、类型与大小校验）。"
    stability: stable
  - package: internal/senders
    layer: capability
    responsibility: "出站消息发送：正文渲染、抑制列表、每发件人锁与发送日志。"
    stability: evolving
  - package: internal/credentials
    layer: capability
    responsibility: "凭证规格与加密存储、OAuth 状态与表单校验。"
    stability: evolving
  - package: internal/globaldb
    layer: capability
    responsibility: "全局数据表（CRM / global data）的 SQLite 访问。"
    stability: evolving
  - package: internal/charts
    layer: capability
    responsibility: "chart_render 的纯 Go 渲染实现（SVG 生成 + 可选 PNG 栅格化）。"
    stability: evolving
    note: "未接线：chart_render 尚未注册进 ToolRegistry。"
  - package: internal/hiveconf
    layer: capability
    responsibility: "全局 configuration.json 的类型严格读取（与 Python 参考同规则），供装配与编排层取配置。"
    stability: evolving
  - package: internal/pipeline
    layer: capability
    responsibility: "配置驱动的 trigger 中间件：Stage 接口、按 order 执行/reject 短路/transform 的 Runner、stage 注册表与 7 个内置 stage（llm_provider/credential_resolver/mcp_registry/skill_registry/input_validation/rate_limit/cost_guard）。"
    stability: evolving
  - package: internal/mcpregistry/nativecli
    layer: capability
    responsibility: "mcp2cli 3.8.0 的 Go 子集实现：MCP 服务器注册表 native CLI 后端。"
    stability: evolving
  - package: internal/tools/integrationkit
    layer: capability
    responsibility: "集成工具的共享原语：传输、凭据与参数 schema 复用件，供 internal/tools/integrations 各模块使用。"
    stability: evolving
  - package: internal/visionfallback
    layer: capability
    responsibility: "文本主模型下的图像转述回退：为工具结果里的图片生成 caption。"
    stability: evolving
  - package: internal/maintenance
    layer: capability
    responsibility: "Janitor：孤儿会话、缓存、工件与事件日志的清理规则与报告。"
    stability: stable

  # ---------------- foundation ----------------
  - package: internal/eventbus
    layer: foundation
    responsibility: "进程内事件总线：AgentEvent、订阅分发、SSE 事件源与事件日志。"
    stability: stable
  - package: internal/storage
    layer: foundation
    responsibility: "会话与检查点的文件存储（part JSON、cursor、index），写入走原子替换。"
    stability: stable
  - package: internal/schemas
    layer: foundation
    responsibility: "跨包共享的数据结构与序列化约定（报告、计划、工具 schema）。"
    stability: stable
  - package: internal/atomicfs
    layer: foundation
    responsibility: "原子文件写入与目录替换，避免半写状态。"
    stability: stable
  - package: internal/hivehome
    layer: foundation
    responsibility: "~/.hive 目录布局解析与 ensure（queens/colonies/memories/credentials/...）。"
    stability: stable
  - package: internal/platform
    layer: foundation
    responsibility: "平台差异：路径、进程与 shell 选择。"
    stability: stable
  - package: internal/version
    layer: foundation
    responsibility: "版本字符串与构建信息。"
    stability: stable
  - package: internal/ratelimit
    layer: foundation
    responsibility: "调用限速：LLM 请求与工具调用的桶式限流器（rate_limits 配置）。"
    stability: stable
  - package: internal/envcontract
    layer: foundation
    responsibility: "环境变量 / configuration.json 冻结契约的只读守卫（报告模式）。"
    stability: stable
    expected_orphan: true
  - package: internal/hiveclock
    layer: foundation
    responsibility: "可注入时钟：供基准与测试冻结对外可见时间。"
    stability: stable
  - package: internal/logging
    layer: foundation
    responsibility: "serve 路径共享的进程日志 sink（时间戳前缀、目标选择）。"
    stability: stable
  - package: internal/pyenv
    layer: foundation
    responsibility: "以 Python 语义解析环境变量覆盖，保证 Go 读取方与参考实现得到同一个值。"
    stability: stable
  - package: internal/resources
    layer: foundation
    responsibility: "进程与宿主内存资源读取（darwin/linux 分离实现）。"
    stability: stable
  - package: internal/arghelp
    layer: foundation
    responsibility: "argparse HelpFormatter 的 Go 移植：usage 折行、选项列宽、choices 与 section 渲染，供 CLI/MCP 帮助共用。"
    stability: stable
  - package: internal/runtimelogs
    layer: foundation
    responsibility: "三级运行日志（summary.json / details.jsonl / tool_logs.jsonl）的 schema、原子写与 logger。"
    stability: evolving
  - package: internal/quality
    layer: foundation
    responsibility: "仓库静态质量门禁：分层 import 检查与文件大小检查，以 go test 形式运行。"
    stability: stable
    expected_orphan: true

  # ---------------- harness ----------------
  - package: e2e/cmd/memgw
    layer: harness
    responsibility: "确定性 OpenAI 兼容假上游的启动命令（memory e2e）。"
    stability: stable
    expected_orphan: true
  - package: e2e/cmd/recordproxy
    layer: harness
    responsibility: "录制转发代理命令：把真实上游流量录成 e2e 夹具。"
    stability: stable
    expected_orphan: true
  - package: e2e/cmd/stallgw
    layer: harness
    responsibility: "确定性假上游命令（stream stall e2e）。"
    stability: stable
    expected_orphan: true
  - package: e2e/cmd/storagecompat
    layer: harness
    responsibility: "HIVE_HOME 存储兼容 / G2 无损迁移夹具的 Go 侧命令。"
    stability: stable
    expected_orphan: true
  - package: e2e/escalationgw
    layer: harness
    responsibility: "worker 升级 e2e 的确定性假上游网关。"
    stability: stable
    expected_orphan: true
  - package: e2e/memgw
    layer: harness
    responsibility: "memory e2e 的确定性假上游网关。"
    stability: stable
  - package: e2e/recordproxy
    layer: harness
    responsibility: "录制转发代理：真实上游流量 → 可回放夹具。"
    stability: stable
  - package: e2e/soulgw
    layer: harness
    responsibility: "soul 反思测试的确定性假上游网关。"
    stability: stable
    expected_orphan: true
  - package: e2e/stallgw
    layer: harness
    responsibility: "stream stall e2e 的确定性假上游网关（可注入停滞）。"
    stability: stable
  - package: internal/release
    layer: harness
    responsibility: "发布脚本（release_slot 等）的回归测试。"
    stability: stable
    expected_orphan: true
  - package: e2e/cmd/runtimelogs
    layer: harness
    responsibility: "三级运行日志双跑的启动命令（e2e）。"
    stability: stable
    expected_orphan: true
  - package: internal/toolgolden
    layer: harness
    responsibility: "工具结果文本的规范化，用于两侧运行时对照。"
    stability: stable
    expected_orphan: true

# 业务能力：与 packages 是同一份模型的另一张面。
# modules    = 实现该能力的包（生成 realizes 边：pkg -> cap）
# operates   = 该能力在运行时对外提供/驱动的入口或数据面（生成 operates 边：cap -> pkg）
capabilities:
  - id: goal-outcome
    name: "目标与结果"
    business_outcome: "把客户的一句话目标变成可验收的结果：目标、加权成功标准、以及每轮结束时的验收判定。"
    actors: ["客户", "Queen", "Worker", "LLM judge"]
    modules: ["internal/colony", "internal/agentloop", "internal/llmjudge", "internal/schemas"]
    operates: ["internal/colony"]
    entrypoints: ["HTTP POST /api/colonies/{colony_id}/scaffold", "tool run_worker(goal, tasks)", "CLI hive colony info"]
    state_artifacts: ["~/.hive/colonies/{colony}/worker.json（goal.description 与 goal.success_criteria）", "worker 终止报告中的 goal_evaluation"]
    human_approval: partial
    maturity: tested
    limits: "成功标准由模型生成，不是形式化规格；未声明 criteria 时不做验收判定，空 tracker 表会单独记为 empty_tracker。"

  - id: queen-triage
    name: "Queen 分诊与对话"
    business_outcome: "用户消息在同一个会话内被理解、追问或分诊为直接回答、工具执行或派工，并以流式事件回放。"
    actors: ["客户", "Queen", "Dashboard"]
    modules: ["internal/server", "internal/queen", "internal/agentloop", "internal/llm", "internal/hiveconf", "internal/soul", "internal/skills", "internal/memory", "internal/attachments"]
    operates: ["internal/server", "internal/cli"]
    entrypoints: ["HTTP POST /api/sessions/{session_id}/chat", "HTTP GET /api/sessions/{session_id}/events (SSE)", "CLI hive chat", "CLI hive serve"]
    state_artifacts: ["~/.hive/queens/{queen}/sessions/{session}/（parts、cursor.json、meta.json）", "~/.hive/queens/{queen}/soul/soul.json"]
    human_approval: partial
    maturity: live
    limits: "单会话单循环串行处理 turn；分诊依赖模型判断，没有确定性路由表；ask_user 与凭证表单会 park 到下一次用户输入。"

  - id: colony-unit
    name: "Colony 部署单元"
    business_outcome: "一次目标对应一个可暂停、可恢复的 colony 目录，绑定 queen、tracker 与 worker 池，使长任务不与单个会话同生共死。"
    actors: ["Queen", "运维/开发者", "Dashboard"]
    modules: ["internal/colony", "internal/host", "internal/session", "internal/storage"]
    operates: ["internal/server", "internal/cli"]
    entrypoints: ["HTTP POST /api/colonies/{colony_id}/scaffold", "HTTP POST /api/sessions/{session_id}/colony（加载已有 colony）", "CLI hive colony list|info|delete"]
    state_artifacts: ["~/.hive/colonies/{colony}/{metadata.json, worker.json}", "~/.hive/colonies/{colony}/{tracker/tracker.db, workers/, queens/, playbooks/}"]
    human_approval: no
    maturity: tested
    limits: "会话 spawn colony 后即锁定，必须 compact-and-fork 才能继续；一个 colony 一个 tracker 库，跨 colony 不共享账本。"

  - id: worker-dispatch
    name: "Worker 派发与回报"
    business_outcome: "Queen 一次 run_worker 提交 N 个任务立即返回，worker 在后台并行执行，每个以一条结构化 [WORKER_REPORT] 回合回报。"
    actors: ["Queen", "Worker", "Dashboard"]
    modules: ["internal/colony", "internal/agentloop", "internal/tools", "internal/eventbus", "internal/tasks"]
    operates: ["internal/colony"]
    entrypoints: ["tool run_worker", "tool report_to_parent", "HTTP GET /api/sessions/{session_id}/workers", "HTTP POST /api/sessions/{session_id}/workers/stop-all"]
    state_artifacts: ["~/.hive/colonies/{colony}/workers/{worker_id}/{worker.json, parts/}", "会话中的一个 [WORKER_REPORT] 用户回合"]
    human_approval: no
    maturity: tested
    limits: "并发受 HIVE_MAX_CONCURRENT_WORKERS 闸门限制；worker 不能递归 run_playbook；stop 只保证不再启动，不回收已发起的上游调用。"

  - id: evidence-tracker
    name: "Tracker、计划与证据"
    business_outcome: "每一行结果都可追溯：worker 写共享账本，Queen 查询账本，任务计划跨回合存活，报告可按会话打包。"
    actors: ["Queen", "Worker", "客户"]
    modules: ["internal/tracker", "internal/tasks", "internal/colony", "internal/server", "internal/sessionreport"]
    operates: ["internal/tracker", "internal/server"]
    entrypoints: ["tool tracker_upsert|tracker_query|tracker_sql", "tool task_create|task_update|task_list|task_get", "HTTP GET /api/sessions/{session_id}/tasks", "HTTP POST /api/sessions/{session_id}/report-bundle"]
    state_artifacts: ["~/.hive/colonies/{colony}/tracker/tracker.db (SQLite WAL)", "{session|worker}/tasks.json", "{session}/reminder_state.json"]
    human_approval: no
    maturity: tested
    limits: "tracker 写入是 worker 的自愿行为，漏写只能从报告文本恢复；SQLite 单写者，跨进程并发写需靠 WAL 与重试。"

  - id: memory-sediment
    name: "记忆与沉淀"
    business_outcome: "跨会话记住偏好与结论；Queen 把经历写进 soul，可审阅、可回滚，而不是每次从零开始。"
    actors: ["Queen", "客户", "运维/开发者"]
    modules: ["internal/memory", "internal/soul", "internal/server", "internal/agentloop"]
    operates: ["internal/server"]
    entrypoints: ["HTTP GET|PUT /api/memories/file", "HTTP POST /api/queen/{queen_id}/soul/reflect", "HTTP POST /api/queen/{queen_id}/soul/proposals/{proposal_id}/decide"]
    state_artifacts: ["~/.hive/memories/*.md", "~/.hive/queens/{queen}/soul/{soul.json, history/v*.json, log.jsonl, proposals/*.json}"]
    human_approval: partial
    maturity: tested
    limits: "记忆是 Markdown + 提示注入，不是向量库；soul 有字符与条数上限，默认 review 模式下提案需人批准。"

  - id: skills-playbook
    name: "技能与 Playbook"
    business_outcome: "把可复用流程固化成技能与可执行 playbook，同一套动作可以批量派给多个 worker。"
    actors: ["开发者", "Queen", "Worker"]
    modules: ["internal/skills", "internal/playbook", "internal/colony", "internal/tools"]
    operates: ["internal/cli", "internal/colony"]
    entrypoints: ["CLI hive skill install|validate|test|trust", "tool run_playbook", "HTTP GET /api/sessions/{session_id}/colony/skills"]
    state_artifacts: ["skills/{name}/SKILL.md", "~/.hive/colonies/{colony}/playbooks/*.play.json", "~/.hive/queens/{queen}/skills_overrides.json"]
    human_approval: partial
    maturity: tested
    limits: "技能是提示词加脚本，不是沙箱；playbook 并发受 HIVE_MAX_PLAYBOOK_CONCURRENCY 上限约束。"

  - id: triggers-sentinel
    name: "触发器与 Sentinel 自治"
    business_outcome: "定时或事件触发能自动唤醒会话；Queen 停泊但目标未完成时，由 Sentinel 决定继续推、升级给人还是不动。"
    actors: ["客户", "Queen", "值班人"]
    modules: ["internal/triggers", "internal/sentinel", "internal/server", "internal/eventbus"]
    operates: ["internal/server"]
    entrypoints: ["HTTP POST /api/sessions/{session_id}/triggers", "HTTP POST /api/sessions/{session_id}/triggers/{trigger_id}/run", "HTTP PUT /api/config/sentinel", "进程内 timer ticker"]
    state_artifacts: ["{session}/triggers.json", "~/.hive/colonies/{colony}/notifications.json", "~/.hive/colonies/{colony}/escalations/"]
    human_approval: partial
    maturity: tested
    limits: "定时器只在服务进程存活时运行；错过的触发需要 resolve_missed 决策，不会自动补跑；escalate 依赖外部渠道可达。"

  - id: tools-credentials
    name: "工具与凭据边界"
    business_outcome: "模型只看见按 tier 过滤后的工具；外部系统的凭据在边界内注入，缺失时停下来等人填，而不是猜。"
    actors: ["模型", "客户", "运维/开发者"]
    modules: ["internal/tools", "internal/tools/builtin", "internal/tools/integrations", "internal/tools/integrationkit", "internal/mcpregistry", "internal/mcpregistry/nativecli", "internal/credentials", "internal/ratelimit", "internal/llm", "internal/charts", "internal/visionfallback"]
    operates: ["internal/tools", "internal/cli"]
    entrypoints: ["CLI hive mcp install|list|doctor", "HTTP GET|PUT /api/credentials", "HTTP GET /api/mcp/servers", "tool search_tools"]
    state_artifacts: ["~/.hive/credentials/（规格与存储）", "~/.hive/secrets/", "~/.hive/mcp_registry/", "~/.hive/configuration.json（rate_limits）"]
    human_approval: yes
    maturity: live
    limits: "没有 OS 级沙箱，MCP 子进程继承当前用户权限；未配置 rate_limits 时限速为无限；凭据缺失会 park 整个 turn。"

  - id: channels-dashboard
    name: "渠道与仪表盘"
    business_outcome: "同一套会话既能从 Web Dashboard 看，也能从 CLI 或聊天渠道接入；状态与事件对操作者可见。"
    actors: ["客户", "值班人", "Dashboard"]
    modules: ["internal/server", "internal/server/uiembed", "internal/runtimehealth", "internal/resources", "internal/senders", "internal/queenmail", "internal/claudecode", "internal/globaldb"]
    operates: ["internal/server", "internal/cli"]
    entrypoints: ["CLI hive serve", "CLI hive open", "HTTP GET /api/channels", "HTTP GET /api/events/global (SSE)"]
    state_artifacts: ["~/.hive/queens/{queen}/sessions/{session}/（元数据与事件）", "~/.hive/event_logs/events.jsonl", "~/.hive/colonies/{colony}/notifications.json"]
    human_approval: no
    maturity: tested
    limits: "渠道 webhook 需外网可达；embed_ui 需要构建标签，否则回退到磁盘前端产物。"

  - id: notifications
    name: "通知与提醒"
    business_outcome: "到点提醒、worker 报告与升级消息被送到人所在的渠道，并且有发送记录可查。"
    actors: ["客户", "值班人", "Queen"]
    modules: ["internal/agentloop", "internal/server", "internal/senders", "internal/sentinel", "internal/tasks"]
    operates: ["internal/server"]
    entrypoints: ["进程内 ReminderHub ticker", "HTTP GET|DELETE /api/sessions/{session_id}/reminders", "HTTP GET /api/colony/{colony_id}/notifications", "HTTP POST /api/sentinel/telegram/detect-chat"]
    state_artifacts: ["{session}/reminder_state.json", "~/.hive/colonies/{colony}/notifications.json", "senders 发送日志（sendlog）"]
    human_approval: no
    maturity: tested
    limits: "提醒依赖进程内 ticker，重启只恢复状态，不补发错过的时点；抑制列表会静默丢弃被抑制的收件人。"

  - id: release-quality
    name: "发布与质量门禁"
    business_outcome: "每次交付可验证：九门禁、架构漂移检查与发布清单都能在本地和 CI 复现，结论可签字。"
    actors: ["开发者", "评审人", "CI"]
    modules: ["internal/quality", "internal/version", "internal/maintenance", "internal/envcontract"]
    operates: ["internal/quality"]
    entrypoints: ["make ci（fmt-check vet test cross parity parity-targets wiring-check compat-check arch-check）", "python3 scripts/qc_check.py", "go test ./internal/quality", "python3 scripts/gen_arch.py --check"]
    state_artifacts: ["go_hive/QC_REPORT.md", "go_hive/RELEASE_CHECKLIST.md", "go_hive/architecture/graph.json"]
    human_approval: yes
    maturity: tested
    limits: "门禁是仓库内脚本与 go test，不覆盖部署环境；架构漂移由 make ci 的 arch-check 阻断，契约自洽由 compat-check 阻断。"

# 接口与契约：模块之间靠什么约束交互。
# kind 七类：go-interface / http / sse / event / disk / tool-schema / cli。
# providers / consumers 可以是 packages 里的包名，也可以是 ext: 前缀的外部消费面
# （ext:frontend、ext:operator、ext:mcp-server、ext:external-caller）。
# compatibility: additive（只允许加法）| breaking（任何变更都要同步改消费方）|
#                versioned（文件/库自带版本号，按版本迁移）。
# enforcement 取值：compile / test / gate / checker。
contracts:
  # ---------------- go-interface ----------------
  - id: "server.ColonyRuntime"
    kind: "go-interface"
    providers: ["internal/colony", "internal/host"]
    consumers: ["internal/server"]
    definition: "internal/server/session.go:ColonyRuntime（StreamID / SubscribeToEvents / InjectInput）"
    guarantee: "传输层只通过这三个方法观察 colony 流、订阅其事件、向 worker 注入输入，不触达 *colony.ColonyRuntime 的内部字段。"
    failure_behavior: "少实现一个方法即编译失败；SubscribeToEvents 返回错误时 HTTP 层按 500 结束该请求。"
    compatibility: "breaking"
    enforcement: ["compile", "test"]
    owner_layer: "transport"

  - id: "llm.Completer"
    kind: "go-interface"
    providers: ["internal/llm"]
    consumers: ["internal/agentloop", "internal/colony", "internal/host", "internal/memory", "internal/server"]
    definition: "internal/llm/llm.go:Completer（AComplete）"
    guarantee: "所有非流式模型调用都走同一个 AComplete(ctx, CompletionRequest) → Completion；provider 选择、协议、鉴权、限速与重试封在 llm 内部，调用方不感知 Anthropic/OpenAI 差异。"
    failure_behavior: "返回 error 表示没有完整回复；调用方不得把部分文本当完成结果持久化。"
    compatibility: "breaking"
    enforcement: ["compile", "test"]
    owner_layer: "capability"

  - id: "llm.StreamCompleter"
    kind: "go-interface"
    providers: ["internal/llm"]
    consumers: ["internal/server"]
    definition: "internal/llm/stream.go:StreamCompleter（ACompleteStream）"
    guarantee: "支持流式的 provider 通过 emit 按线上顺序发 TextDelta / ToolCall / TextEnd / Finish；返回的 Completion 与非流式路径一致，可直接写历史。"
    failure_behavior: "ErrStreamingUnsupported 或流中断时 server 回退到 Completer.AComplete；error 时不得把部分文本当最终回答。"
    compatibility: "breaking"
    enforcement: ["compile", "test"]
    owner_layer: "capability"

  - id: "agentloop.ToolExecutor"
    kind: "go-interface"
    providers: ["internal/colony", "internal/server", "internal/cli"]
    consumers: ["internal/agentloop"]
    definition: "internal/agentloop/loop.go:ToolExecutor（func(ToolCallRequest) (ToolResult, error)）"
    guarantee: "循环只认这个函数：工具名解析、权限、限速、审计都在 executor 侧；循环负责批处理、并发安全分组与结果写回。"
    failure_behavior: "executor 返回 error 时，循环把错误文本作为 is_error 工具结果回给模型，不终止整轮。"
    compatibility: "breaking"
    enforcement: ["compile", "test"]
    owner_layer: "runtime"

  - id: "agentloop.Judge"
    kind: "go-interface"
    providers: ["internal/agentloop"]
    consumers: ["internal/agentloop", "internal/colony"]
    definition: "internal/agentloop/judge.go:Judge（Evaluate）"
    guarantee: "成功标准判定通过该接口注入；agentloop 提供 LLMJudgeAdapter（底层 llmjudge），colony 用它做 worker 目标验收。"
    failure_behavior: "judge 返回 error 时归一化为 RETRY 并附反馈；无 judge 且声明了成功标准时判定为 unsupported，不计为 met，不假装通过。"
    compatibility: "breaking"
    enforcement: ["compile", "test"]
    owner_layer: "runtime"

  - id: "eventbus.EventHandler"
    kind: "go-interface"
    providers: ["internal/eventbus"]
    consumers: ["internal/server", "internal/colony", "internal/host"]
    definition: "internal/eventbus/bus.go:EventHandler / Subscribe"
    guarantee: "订阅者按 EventType 集合与 stream/node/execution/colony 过滤接收 *AgentEvent；Bus 同步分发，返回订阅 ID 供退订。"
    failure_behavior: "handler panic 被 recover 并记日志，不影响其他订阅者；handler 阻塞会拖慢同步发布，队列满的 SSE 桥会主动丢帧或断开。"
    compatibility: "breaking"
    enforcement: ["compile", "test"]
    owner_layer: "foundation"

  - id: "host.Host"
    kind: "go-interface"
    providers: ["internal/host"]
    consumers: ["internal/cli"]
    definition: "internal/host/host.go:Host（New / Start / Spawn / Run / Bus / Stats / Stop）"
    guarantee: "把 colony runtime、event bus 与 run 注册表封装成可 Start/Spawn 的宿主；Spawn 非阻塞，Run 阻塞，进度经 Bus/Stats 读取。"
    failure_behavior: "New 缺 LLM 或 AgentSpec.ID 返回 error；未 Start 时 Spawn/Run 先 ensureStarted；Stop 后由 Started() 反映状态。"
    compatibility: "breaking"
    enforcement: ["compile", "test"]
    owner_layer: "orchestration"

  # ---------------- http ----------------
  - id: "http.sessions"
    kind: "http"
    providers: ["internal/server"]
    consumers: ["ext:frontend", "internal/cli"]
    definition: "internal/server/routes_sessions.go:RegisterSessionRoutes + chat/task/worker/reminder/attachment 路由"
    guarantee: "会话 REST：创建/查询/fork/发送消息/任务/worker/提醒/触发器/报告；请求与响应为 JSON，错误统一 {error:...}；chat 接受后立即返回，输出走 SSE。"
    failure_behavior: "未知 session 404；colony 已 spawn 或已 fork 409 session_locked；未配置 LLM 503；坏 JSON 400。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  - id: "http.colonies"
    kind: "http"
    providers: ["internal/server"]
    consumers: ["ext:frontend"]
    definition: "internal/server/routes_colonies.go:RegisterColonyRoutes + routes_colony_tools.go + routes_colony_workers_data.go"
    guarantee: "colony 生命周期与数据面：scaffold/rename/delete/import、worker profiles、colony 数据表行查询与 PATCH；scaffold 幂等，不覆盖已有 triggers.json。"
    failure_behavior: "不存在 404；非法 colony 名 400；导入分片缺 upload_id 404；重复 scaffold 保持原内容。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  - id: "http.queens"
    kind: "http"
    providers: ["internal/server"]
    consumers: ["ext:frontend"]
    definition: "internal/server/routes_queens.go:RegisterQueenRoutes + routes_queens_tools.go + routes_queens_claude_code.go + routes_queens_mail.go"
    guarantee: "queen 档案、人格、头像、工具 allowlist、会话绑定与 queen 间信件；列表响应带 profiles/queens 键，单对象按 profile/overview 返回。"
    failure_behavior: "未知 queen 404；非法 profile 400；删除/恢复是软删除标记，重复操作幂等。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  - id: "http.credentials"
    kind: "http"
    providers: ["internal/server"]
    consumers: ["ext:frontend"]
    definition: "internal/server/routes_credentials.go:RegisterCredentialRoutes + routes_credentials_specs.go + routes_credentials_form.go"
    guarantee: "凭证 CRUD、规格列表、OAuth 状态、凭证表单提交；GET 只返回元数据，秘密值只写不读。"
    failure_behavior: "未知凭证 404；缺字段 400；解密失败时单条 GET 返回 409 且 recoverable=true，列表把不可读 id 放进 unreadable_credentials，不泄漏秘密；表单提交会恢复被 park 的 turn。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  - id: "http.config"
    kind: "http"
    providers: ["internal/server"]
    consumers: ["ext:frontend"]
    definition: "internal/server/routes_config.go:RegisterConfigRoutes + routes_models.go"
    guarantee: "configuration.json 的读写面：features / llm / rate-limits / profile / provider-library / sentinel / external-skills，以及只读 models 目录；写入以 JSON 合并 + 原子替换落盘。"
    failure_behavior: "非法 JSON 或未知枚举 400；读取失败回退默认配置；写盘失败 500，内存状态不先行生效。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  - id: "http.mcp"
    kind: "http"
    providers: ["internal/server"]
    consumers: ["ext:frontend"]
    definition: "internal/server/routes_mcp.go:RegisterMCPRoutes"
    guarantee: "MCP 服务器注册表 HTTP 面：list/add/delete/enable/disable/health/mode/reload；返回 server 视图，工具命名空间由 tools 层决定。"
    failure_behavior: "未安装 server 404；健康检查失败在响应体标 ok=false 而非 5xx；reload 部分失败返回 500 且带 reloaded=false。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  - id: "http.events"
    kind: "http"
    providers: ["internal/server"]
    consumers: ["ext:frontend", "ext:external-caller"]
    definition: "internal/server/routes_events.go:RegisterEventRoutes"
    guarantee: "全局事件入口：GET /api/events/global 是 SSE（见 sse.global-events）；POST /api/crm/changed 接受 {entities[], schema} 并广播 crm_changed。"
    failure_behavior: "非 SSE 客户端 500；/api/crm/changed 的坏 JSON 被当空对象；未知实体丢弃；成功恒为 200 {ok:true}。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  - id: "http.global-data"
    kind: "http"
    providers: ["internal/server"]
    consumers: ["ext:frontend"]
    definition: "internal/server/routes_colony_workers_global.go（/api/global/* 与 /api/crm/grid/*）"
    guarantee: "global data 与 CRM grid 的通用表读写：表名/实体名走路径，查询体为自由 JSON，行操作返回 rows/columns 等通用结构。"
    failure_behavior: "未知表/实体 404；非法查询或未知列 400；SQLite 约束/写冲突由 handler 映射为 4xx 或 5xx，响应体带 error。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  # ---------------- sse ----------------
  - id: "sse.session-events"
    kind: "sse"
    providers: ["internal/server", "internal/eventbus"]
    consumers: ["ext:frontend"]
    definition: "internal/server/chat_routes.go:handleSessionEventsStream（GET /api/sessions/{session_id}/events）"
    guarantee: "每帧 event: <EventType> + data: <AgentEvent.ToDict()>；订阅时先发 event: session_snapshot；空闲发 ': heartbeat' 注释；?types=a,b 可过滤。"
    failure_behavior: "非 Flusher 500；会话不存在 404；队列满时非阻塞丢帧，客户端靠 snapshot 与重连恢复。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  - id: "sse.global-events"
    kind: "sse"
    providers: ["internal/server", "internal/eventbus"]
    consumers: ["ext:frontend"]
    definition: "internal/server/routes_events.go:handleGlobalEvents（GET /api/events/global）"
    guarantee: "只转发 5 类全局事件（credential connect/disconnect、tool catalog refresh、tools config、crm changed）；帧是 data-only（无 event 名），空闲发 ': keepalive'。"
    failure_behavior: "非 Flusher 500；队列满即断开让客户端重连；globalEventTypes 是白名单，新增全局事件必须同步改它。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  - id: "sse.live-streams"
    kind: "sse"
    providers: ["internal/server", "internal/runtimehealth"]
    consumers: ["ext:frontend"]
    definition: "internal/server/routes_session_live.go:handleLiveSessionsStream + routes_workers.go:handleLiveWorkersStream + routes_app_extra.go:handleBrowserStatusStream"
    guarantee: "轮询式 SSE：/api/sessions/live 与 /api/sessions/{id}/workers/stream 发 event: snapshot，/api/browser/status/stream 发 event: status；只有签名变化才推送，空闲发 keepalive 注释。"
    failure_behavior: "非 Flusher 500；会话或运行时缺失返回 404/空快照；轮询无变化时不发帧。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "transport"

  # ---------------- event ----------------
  - id: "event.agent-event-envelope"
    kind: "event"
    providers: ["internal/eventbus"]
    consumers: ["internal/server", "internal/colony", "internal/host", "internal/tasks", "internal/cli", "ext:frontend"]
    definition: "internal/eventbus/event.go:AgentEvent / ToDict"
    guarantee: "统一信封：type / stream_id / node_id / execution_id / data / timestamp / correlation_id / colony_id / seq，可选 run_id；timestamp 为本地 ISO8601（微秒可选）；落盘剥离 data.full_request。"
    failure_behavior: "Data 为 nil 时 ToDict 归一为空 map；字段不做运行期类型校验，消费方按 map 断言，缺失即零值。"
    compatibility: "additive"
    enforcement: ["compile", "test", "checker"]
    owner_layer: "foundation"

  - id: "event.type-registry"
    kind: "event"
    providers: ["internal/eventbus"]
    consumers: ["internal/server", "internal/colony", "internal/host", "internal/tasks", "internal/cli"]
    definition: "internal/eventbus/event_type.go:EventType / AllEventTypes"
    guarantee: "事件类型是字符串常量集合，AllEventTypes 是订阅与文档的唯一清单；新增类型必须同时加常量与清单。"
    failure_behavior: "拼写错误不会编译失败（字符串类型）；未知类型仍可发布，订阅方收不到；改已有字符串值等于破坏订阅方。"
    compatibility: "additive"
    enforcement: ["compile", "test", "checker"]
    owner_layer: "foundation"

  - id: "event.worker-report"
    kind: "event"
    providers: ["internal/colony"]
    consumers: ["internal/server", "ext:frontend"]
    definition: "internal/colony/runtime.go:publishReport + internal/colony/worker.go:reportPayload"
    guarantee: "worker 终态统一发 subagent_report：worker_id / colony_id / status / summary / task / data，可选 goal_evaluation、improvement_signals、batch_id/index/size、duration_seconds；ChatRuntime 将其转成 [WORKER_REPORT] 用户回合。"
    failure_behavior: "缺 data 时补空 map；status 只认 success/partial/failed；报告发布无返回值，失败只记日志，不回滚 worker 终态。"
    compatibility: "additive"
    enforcement: ["test", "checker"]
    owner_layer: "orchestration"

  # ---------------- disk ----------------
  - id: "disk.colony-worker-json"
    kind: "disk"
    providers: ["internal/server", "internal/colony"]
    consumers: ["internal/agents", "internal/colony", "internal/cli"]
    definition: "internal/server/routes_colonies.go:ensureMinimalColony（~/.hive/colonies/{colony}/worker.json）"
    guarantee: "colony 的 worker 模板：name / description / tools[] / goal{description,success_criteria,constraints} / queen_name / loop_config；agents.LoadAgentSpec 按文件名排序取第一个 worker 配置。"
    failure_behavior: "缺失时 scaffold 生成最小模板；JSON 损坏时 LoadAgentSpec 报错、colony 无法派工；未知字段忽略。"
    compatibility: "additive"
    enforcement: ["test"]
    owner_layer: "orchestration"

  - id: "disk.colony-metadata"
    kind: "disk"
    providers: ["internal/server"]
    consumers: ["internal/server", "internal/host", "internal/cli"]
    definition: "internal/server/routes_colonies.go:updateColonyMetadata（~/.hive/colonies/{colony}/metadata.json）"
    guarantee: "colony 级元数据自由 map：name / created_at / queen_name / scaffolded / deleted / source_session；scaffold、rename、delete 都走原子写。"
    failure_behavior: "缺失或坏 JSON 视为空 map；写入失败返回 500；deleted 是软删除标记，不立刻删目录。"
    compatibility: "additive"
    enforcement: ["test"]
    owner_layer: "orchestration"

  - id: "disk.worker-meta"
    kind: "disk"
    providers: ["internal/colony"]
    consumers: ["internal/colony", "internal/server"]
    definition: "internal/colony/worker_transcript.go:writeWorkerMeta（workers/{id}/meta.json）"
    guarantee: "worker 重启所需的血缘：worker_id / colony_id / task / profile_name / goal / batch_id / batch_index / batch_size；与 conversations/、result.json、events.jsonl 同目录。"
    failure_behavior: "缺失或坏 JSON 时 readWorkerMeta 返回空 map，resume 退化为按 parts 恢复；worker 目录无 parts 则不可 resume。"
    compatibility: "additive"
    enforcement: ["test"]
    owner_layer: "orchestration"

  - id: "disk.session-meta"
    kind: "disk"
    providers: ["internal/server", "internal/session"]
    consumers: ["internal/server", "internal/session"]
    definition: "internal/server/queen_phase_state.go:mergeSessionMeta（sessions/{id}/meta.json）"
    guarantee: "会话级元数据：title / title_source、queen phase、colony_spawned / spawned_colony_id / spawned_colony_at；写入按 key 合并并原子替换。"
    failure_behavior: "损坏时读为空，标题与 phase 回退默认；缺 colony_spawned 时按未 spawn 处理。"
    compatibility: "additive"
    enforcement: ["test"]
    owner_layer: "orchestration"

  - id: "disk.cursor-json"
    kind: "disk"
    providers: ["internal/agentloop", "internal/session", "internal/storage"]
    consumers: ["internal/agentloop", "internal/session", "internal/storage", "internal/server"]
    definition: "internal/session/session.go:Cursor / WriteCursor + internal/agentloop/store.go"
    guarantee: "turn 游标：iteration / turn / accumulated_output / tool_calls / stall_repeat / last_fingerprint / pending_inputs / park_reason / updated_at，park 后可精确恢复。"
    failure_behavior: "损坏或截断按不存在处理（readDerivedJSON），从 parts 重建；写失败只影响恢复精度，不影响当前 turn。"
    compatibility: "additive"
    enforcement: ["test"]
    owner_layer: "orchestration"

  - id: "disk.triggers-json"
    kind: "disk"
    providers: ["internal/triggers", "internal/server"]
    consumers: ["internal/triggers", "internal/server"]
    definition: "internal/triggers/triggers_store.go:ReadAgentTriggersJSON / WriteAgentTriggersJSON"
    guarantee: "顶层数组，每项 TriggerDefinition：id / trigger_type / trigger_config / description / task / enabled / last_fired_at / next_due_at；按 id 覆盖写。"
    failure_behavior: "文件缺失、坏 JSON、非数组一律读成空数组；写失败向上返回 error，调用方记日志。"
    compatibility: "additive"
    enforcement: ["test"]
    owner_layer: "orchestration"

  - id: "disk.soul-json"
    kind: "disk"
    providers: ["internal/soul"]
    consumers: ["internal/soul", "internal/server"]
    definition: "internal/soul/store.go:SoulFile / Save（~/.hive/queens/{queen}/soul/soul.json）"
    guarantee: "Queen 自我认知：version / updated_at / sections{key:[Item]}；history/v{n}.json 保留版本，proposals/*.json 存待审提案；写前做分区字符上限校验。"
    failure_behavior: "缺失时 Load 返回空 soul；越界 edit 被 Problems/ApplyEdits 拒绝并返回 SoulError；回滚按 version 读历史。"
    compatibility: "versioned"
    enforcement: ["test"]
    owner_layer: "capability"

  - id: "disk.tracker-db"
    kind: "disk"
    providers: ["internal/tracker"]
    consumers: ["internal/colony", "internal/tracker", "internal/server"]
    definition: "internal/tracker/tracker.go:EnsureTrackerDB / bootstrapSchema（~/.hive/colonies/{colony}/tracker/tracker.db）"
    guarantee: "SQLite(WAL)：_tracker_registry 登记可写列/键/模式，_tracker_meta 存 schema_version，_tracker_changes 记录 insert/update；业务表由 queen 动态建。"
    failure_behavior: "PRAGMA user_version 小于 SchemaVersion(3) 时执行 bootstrap + backfill；busy_timeout 5s，写冲突由工具层归一为 is_error。"
    compatibility: "versioned"
    enforcement: ["test"]
    owner_layer: "orchestration"

  # ---------------- tool-schema ----------------
  - id: "tool-schema.tool-def"
    kind: "tool-schema"
    providers: ["internal/tools", "internal/llm", "internal/tools/integrations"]
    consumers: ["internal/agentloop", "internal/llm"]
    definition: "internal/llm/llm.go:ToolDef + internal/tools/tool.go:Tool.Schema"
    guarantee: "工具对模型的唯一描述：name / description / input_schema(JSON Schema object) / produces_image / concurrency_safe；registry 的 Tool 转成 {name,description,input_schema} 进入 CompletionRequest.Tools。"
    failure_behavior: "Parameters 为 nil 时补空 object schema；schema 不做本地校验，provider 可能 400；重名工具的取舍由 registry 加载规则决定。"
    compatibility: "additive"
    enforcement: ["compile", "test"]
    owner_layer: "capability"

  - id: "tool-schema.mcp-namespace"
    kind: "tool-schema"
    providers: ["internal/tools"]
    consumers: ["internal/agentloop", "internal/server", "internal/colony"]
    definition: "internal/tools/mcp_registry.go:NamespacedMCPToolName"
    guarantee: "MCP 工具注册名固定 mcp__<server>__<tool>；server/tool 中非 [A-Za-z0-9_] 字符折叠为 _；命名空间阻止远端 read_file 覆盖内置工具。"
    failure_behavior: "清洗后为空回退 server/tool；同名冲突按加载顺序 shadow 并记日志（preserve 模式跳过）；调用失败归一为 is_error 工具结果。"
    compatibility: "additive"
    enforcement: ["compile", "test"]
    owner_layer: "capability"

  # ---------------- cli ----------------
  - id: "cli.serve"
    kind: "cli"
    providers: ["internal/cli", "internal/server"]
    consumers: ["ext:operator"]
    definition: "internal/cli/loader.go:serveCommand（hive serve / hive open）"
    guarantee: "默认绑定 127.0.0.1:8787；支持 --host / --port / --colony(可重复) / --model / --open / --verbose / --debug；启动 HTTP+SSE 并阻塞到信号；退出码 0 正常、非 0 启动失败。"
    failure_behavior: "端口占用或监听失败打印错误并返回非 0；非 loopback 且未设 HIVE_DESKTOP_TOKEN 时拒绝启动返回 1；SIGINT/SIGTERM 触发优雅停止。"
    compatibility: "additive"
    enforcement: ["test"]
    owner_layer: "assembly"

  - id: "cli.chat"
    kind: "cli"
    providers: ["internal/cli", "internal/server"]
    consumers: ["ext:operator"]
    definition: "internal/cli/loader.go:chatCommand + cmdChat"
    guarantee: "hive chat <session_id> <message> [--server URL] 通过 HTTP POST /api/sessions/{id}/chat 投递，成功打印 SSE 跟踪地址；默认 server 为 http://127.0.0.1:8787。"
    failure_behavior: "网络不可达或响应带 error 时打印错误并返回 1；409 session_locked 原样透出。"
    compatibility: "additive"
    enforcement: ["test"]
    owner_layer: "assembly"

  - id: "cli.colony"
    kind: "cli"
    providers: ["internal/cli", "internal/colony"]
    consumers: ["ext:operator"]
    definition: "internal/cli/loader.go:colonyCommands（hive colony list|info|delete）"
    guarantee: "list 枚举 ~/.hive/colonies 下的 colony；info 读 metadata.json/worker.json；delete 删目录（--purge-storage 同时删 agents 存储，--yes 跳过确认）；--json 输出机器可读结构。"
    failure_behavior: "不存在返回非 0 并打印 not found；delete 无 --yes 时交互确认；purge 失败返回非 0 并报告已删除/未删除部分。"
    compatibility: "additive"
    enforcement: ["test"]
    owner_layer: "assembly"

# 磁盘格式表（人工维护）：契约层 disk.* 的展开，补上路径、生产者/消费者、关键字段与迁移策略。
disk_formats:
  - path: "~/.hive/colonies/{colony}/worker.json"
    producer: "internal/server（scaffold）"
    consumer: "internal/agents、internal/colony、internal/cli"
    key_fields: "name、description、tools[]、goal{description, success_criteria[], constraints[]}、queen_name、loop_config"
    versioning: "无 schema 版本；解码按 map/结构体，未知字段忽略，新增字段属于加法兼容。"
  - path: "~/.hive/colonies/{colony}/metadata.json"
    producer: "internal/server"
    consumer: "internal/server、internal/host、internal/cli"
    key_fields: "name、created_at、queen_name、scaffolded、deleted、source_session_id"
    versioning: "无 schema 版本；自由 map，缺失或坏 JSON 读成空 map。"
  - path: "~/.hive/colonies/{colony}/workers/{worker_id}/meta.json"
    producer: "internal/colony"
    consumer: "internal/colony、internal/server"
    key_fields: "worker_id、colony_id、task、profile_name、goal、batch_id、batch_index、batch_size"
    versioning: "无 schema 版本；缺失时 resume 退化为按 conversations/parts 恢复。"
  - path: "~/.hive/queens/{queen}/sessions/{session}/meta.json"
    producer: "internal/server、internal/session"
    consumer: "internal/server（adapters_qmail.go）、internal/session"
    key_fields: "title、title_source、phase、colony_spawned、spawned_colony_id、spawned_colony_at"
    versioning: "无 schema 版本；按 key 合并，未知字段保留，坏文件回退默认。"
  - path: "…/sessions/{session}/conversations/cursor.json"
    producer: "internal/agentloop、internal/session、internal/storage"
    consumer: "internal/agentloop、internal/session、internal/storage、internal/server"
    key_fields: "iteration、turn、accumulated_output、tool_calls、stall_repeat、last_fingerprint、pending_inputs[]、park_reason、updated_at"
    versioning: "无 schema 版本；派生状态，损坏按不存在处理并从 parts 重建。"
  - path: "{session|colony}/triggers.json"
    producer: "internal/triggers、internal/server"
    consumer: "internal/triggers、internal/server"
    key_fields: "id、trigger_type、trigger_config、description、task、enabled、last_fired_at、next_due_at"
    versioning: "顶层数组、无版本号；非数组/坏 JSON 读成空数组。"
  - path: "~/.hive/queens/{queen}/soul/soul.json（+ history/v{n}.json、proposals/*.json）"
    producer: "internal/soul"
    consumer: "internal/soul、internal/server、internal/agentloop"
    key_fields: "version、updated_at、sections{key:[Item]}；history 按 version 命名，proposal 带 base_version/edits/status"
    versioning: "文件内 version:int 即版本号；回滚按 version 读 history，迁移需同时处理 history 目录。"
  - path: "~/.hive/colonies/{colony}/tracker/tracker.db"
    producer: "internal/tracker"
    consumer: "internal/colony、internal/tracker、internal/server"
    key_fields: "_tracker_registry(table_name, write_columns, key_columns, mode)、_tracker_meta(schema_version)、_tracker_changes；业务表由 queen 动态创建"
    versioning: "PRAGMA user_version=3（SchemaVersion）；低于当前版本执行 bootstrap + backfill，只做加法迁移。"

# 业务能力主链路：决定 capability-map.mmd 的泳道与箭头。
business_flow:
  title: "从客户目标到交付与改进"
  stages:
    - id: intent
      name: "客户目标"
      capabilities: ["goal-outcome"]
    - id: orchestration
      name: "Queen 编排"
      capabilities: ["queen-triage", "colony-unit", "worker-dispatch"]
    - id: execution
      name: "执行与支撑"
      capabilities: ["skills-playbook", "tools-credentials", "memory-sediment"]
    - id: evidence
      name: "证据与自治"
      capabilities: ["evidence-tracker", "triggers-sentinel", "notifications"]
    - id: delivery
      name: "交付与改进"
      capabilities: ["channels-dashboard", "release-quality"]
  edges:
    - from: goal-outcome
      to: queen-triage
    - from: queen-triage
      to: colony-unit
    - from: queen-triage
      to: memory-sediment
    - from: colony-unit
      to: worker-dispatch
    - from: worker-dispatch
      to: evidence-tracker
    - from: worker-dispatch
      to: skills-playbook
    - from: tools-credentials
      to: worker-dispatch
    - from: triggers-sentinel
      to: queen-triage
    - from: triggers-sentinel
      to: notifications
    - from: evidence-tracker
      to: channels-dashboard
    - from: notifications
      to: channels-dashboard
    - from: evidence-tracker
      to: release-quality
    - from: release-quality
      to: goal-outcome
      dashed: true
